<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar navigation groups — preview</title>
<style>
  :root {
    --bg: #0e1523;
    --element: #202e44;
    --element-border: #263044;
    --accent: #7aadee;
    --text: #e8edf5;
    --subtext: #8c98ac;
    --titleline: #283244;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #3a3d42;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
  }

  .window {
    width: 635px;
    height: 541px;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    display: flex;
    flex-direction: column;
  }

  .titlebar {
    height: 42px;
    flex: 0 0 42px;
    border-bottom: 1px solid var(--titleline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-title { font-size: 12px; }
  .brand-sub { font-size: 12px; color: var(--subtext); }
  .win-actions { display: flex; gap: 14px; color: var(--subtext); font-size: 14px; }

  .body { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    position: relative;
    width: 160px;
    flex: 0 0 160px;
    padding-top: 12px;
  }

  .accent {
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 22px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
    transform: translateY(12px);
    transition: transform 160ms var(--ease-out);
  }

  .nav { width: 100%; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(100% - 24px);
    height: 34px;
    margin-left: 12px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--subtext);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .row svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .row .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.selected { color: var(--text); font-weight: 600; }

  .group > .header svg { transition: color 160ms var(--ease-out); }
  .group.open > .header { color: var(--text); }
  .group.open > .header svg { color: var(--accent); }

  .sublist {
    position: relative;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 220ms var(--ease-out), opacity 160ms var(--ease-out);
  }
  .group.open .sublist { max-height: 160px; opacity: 1; }

  .child {
    height: 30px;
    margin-left: 30px;
    width: calc(100% - 42px);
    font-size: 12px;
  }
  .child svg { width: 14px; height: 14px; flex-basis: 14px; }

  .content { flex: 1; padding: 22px 26px; overflow: hidden; }
  .content h1 { margin: 0 0 24px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

  .card {
    background: var(--element);
    border: 1px solid var(--element-border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card .t { font-size: 13px; font-weight: 600; }
  .card .d { font-size: 12px; color: var(--subtext); margin-top: 3px; }
  .card .right { float: right; font-size: 12px; color: var(--subtext); }

  @media (prefers-reduced-motion: reduce) {
    .accent, .sublist, .group > .header svg { transition-duration: 80ms; }
    .sublist { transition-property: opacity; }
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="brand"><span class="brand-title">Fluent 1.1.0</span><span class="brand-sub">by dawid</span></div>
      <div class="win-actions"><span>&#8722;</span><span>&#9633;</span><span>&#215;</span></div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="accent" id="accent"></div>
        <nav class="nav" id="nav">
          <button class="row flat" data-select="main">
            <svg viewBox="0 0 24 24"><path d="M3 8 12 3l9 5-9 5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
            <span class="label">Main</span>
          </button>
          <button class="row flat" data-select="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
            <span class="label">Settings</span>
          </button>

          <div class="group open" data-group="a">
            <button class="row header" data-toggle="a">
              <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
              <span class="label">Section A</span>
            </button>
            <div class="sublist">
              <button class="row child selected" data-select="child-one" data-parent="a">
                <svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
                <span class="label">Child one</span>
              </button>
              <button class="row child" data-select="child-two" data-parent="a">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>
                <span class="label">Child two</span>
              </button>
            </div>
          </div>

          <div class="group" data-group="b">
            <button class="row header" data-toggle="b">
              <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v9H3z"/></svg>
              <span class="label">Section B</span>
            </button>
            <div class="sublist">
              <button class="row child" data-select="child-three" data-parent="b">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2"/></svg>
                <span class="label">Child three</span>
              </button>
            </div>
          </div>
        </nav>
      </aside>

      <main class="content">
        <h1 id="page-title">Child one</h1>
        <div class="section-title">Interface</div>
        <div class="card"><div class="t">Theme</div><div class="d">Changes the interface theme.</div><span class="right">Navy</span></div>
        <div class="card"><div class="t">A very long child title that should truncate rather than overflow the rail</div><div class="d">Ellipsis check</div></div>
        <div class="card"><div class="t">Toggle</div><span class="right">Off</span></div>
      </main>
    </div>
  </div>

<script>
  const nav = document.getElementById('nav');
  const accent = document.getElementById('accent');
  const sidebar = document.querySelector('.sidebar');
  const title = document.getElementById('page-title');

  function placeAccent(row) {
    const y = row.getBoundingClientRect().top - sidebar.getBoundingClientRect().top;
    accent.style.transform = `translateY(${Math.round(y + row.offsetHeight / 2 - 11)}px)`;
  }

  function select(row) {
    nav.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
    row.classList.add('selected');
    title.textContent = row.querySelector('.label').textContent;
    requestAnimationFrame(() => placeAccent(row));
  }

  // Only one group may be open. Opening a different one closes the rest and
  // moves the selection to that group's first child, so the selected row is
  // always visible.
  function openGroup(name) {
    nav.querySelectorAll('.group').forEach((group) => {
      const open = group.dataset.group === name;
      group.classList.toggle('open', open);
      group.querySelector('[data-toggle]').setAttribute('aria-expanded', String(open));
    });
  }

  nav.addEventListener('click', (e) => {
    const header = e.target.closest('[data-toggle]');
    if (header) {
      const group = header.closest('.group');
      // A header can only OPEN its group, never close it. A group closes only
      // when another one opens or when a flat tab is selected.
      if (!group.classList.contains('open')) {
        openGroup(group.dataset.group);
        const firstChild = group.querySelector('.row.child');
        if (firstChild) select(firstChild);
      }
      return;
    }

    const row = e.target.closest('[data-select]');
    if (!row) return;
    const parent = row.dataset.parent;
    if (parent) {
      const group = nav.querySelector(`[data-group="${parent}"]`);
      if (!group.classList.contains('open')) openGroup(parent);
    } else {
      // Flat tab selected: no group should remain open.
      nav.querySelectorAll('.group.open').forEach((group) => {
        group.classList.remove('open');
        group.querySelector('[data-toggle]').setAttribute('aria-expanded', 'false');
      });
    }
    select(row);
  });

  // After a group finishes expanding, re-place the accent in case layout moved.
  nav.querySelectorAll('.sublist').forEach((sublist) => {
    sublist.addEventListener('transitionend', () => {
      const selected = nav.querySelector('.row.selected');
      if (selected && sublist.contains(selected)) placeAccent(selected);
    });
  });

  // The script is at the end of <body>, so the DOM is already ready.
  select(nav.querySelector('.row.selected'));
  window.addEventListener('load', () => select(nav.querySelector('.row.selected')));
</script>
</body>
</html>
